const FONT='"Orbitron","JetBrains Mono",ui-monospace,monospace';
const MONO='"JetBrains Mono",ui-monospace,monospace';

/* ---------- SHA-256 ---------- */
const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(str){
  const b=new TextEncoder().encode(str),l=b.length,nb=((l+9+63)>>6)<<6;
  const m=new Uint8Array(nb);m.set(b);m[l]=0x80;
  const dv=new DataView(m.buffer);
  dv.setUint32(nb-4,(l*8)>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64);
  for(let i=0;i<nb;i+=64){
    for(let j=0;j<16;j++)w[j]=dv.getUint32(i+j*4);
    for(let j=16;j<64;j++){
      const a=w[j-15],c=w[j-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
      const s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;
    }
    let a=h[0],b2=h[1],c2=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(let j=0;j<64;j++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+K[j]+w[j])>>>0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const mj=(a&b2)^(a&c2)^(b2&c2);
      const t2=(S0+mj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c2;c2=b2;b2=a;a=(t1+t2)>>>0;
    }
    h=[(h[0]+a)>>>0,(h[1]+b2)>>>0,(h[2]+c2)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];
  }
  return h.map(v=>v.toString(16).padStart(8,'0')).join('');
}

/* ---------- RNG + NOISE ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,p,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const x0=p?((xi%p)+p)%p:xi,x1=p?(x0+1)%p:xi+1;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(x0,yi,s),b=hash2(x1,yi,s),c=hash2(x0,yi+1,s),d=hash2(x1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,o,p,s){let sum=0,amp=.5,f=1,n=0;for(let i=0;i<o;i++){sum+=amp*vnoise(x*f,y*f,p?p*f:0,s+i);n+=amp;amp*=.5;f*=2;}return sum/n;}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function fbmTex(w,h,per,sy,oct,seed,rgb,pw,gain){
  const c=mkCanvas(w,h),x=c.getContext('2d'),im=x.createImageData(w,h),d=im.data;
  for(let j=0;j<h;j++){
    const fade=Math.sin(Math.PI*j/h);
    for(let i=0;i<w;i++){
      let n=fbm(i/w*per,j/h*sy,oct,per,seed);
      n=Math.min(1,Math.max(0,(n-.38)*2.4));
      n=Math.pow(n,pw)*gain*fade;
      const k=(j*w+i)*4;
      d[k]=rgb[0];d[k+1]=rgb[1];d[k+2]=rgb[2];d[k+3]=Math.min(255,n*255);
    }
  }
  x.putImageData(im,0,0);return c;
}

/* ---------- SCENE CONSTANTS ---------- */
const LY=Math.round(H*.60),MY=Math.round(H*.72);
const SUN={x:W*.68,y:H*.44};
const bg=mkCanvas(W,H),fg=mkCanvas(W,H);
let cloudA,cloudB,mist,bokeh,vig,grain,grainPat;
let farTrees=[],bigTrees=[],treeSprites=[],bigSprite;
let GX,GY,GH,GP;const GR_N=[500,1000,1900];
let pollen=[],boks=[],glit=[],deer=[];

function buildBG(){
  const x=bg.getContext('2d');
  let g=x.createLinearGradient(0,0,0,H*.56);
  g.addColorStop(0,'#0a1730');g.addColorStop(.35,'#2c4a7c');g.addColorStop(.7,'#c98a78');g.addColorStop(1,'#ffd9a2');
  x.fillStyle=g;x.fillRect(0,0,W,LY);
  const r=mulberry32(7);x.fillStyle='#fff';
  for(let i=0;i<140;i++){const sx=r()*W,sy=r()*H*.18;x.globalAlpha=r()*.55*(1-sy/(H*.18));x.fillRect(sx,sy,1.4,1.4);}
  x.globalAlpha=1;
  const sg=x.createRadialGradient(SUN.x,SUN.y,0,SUN.x,SUN.y,H*.55);
  sg.addColorStop(0,'rgba(255,246,220,1)');sg.addColorStop(.02,'rgba(255,232,185,.95)');sg.addColorStop(.08,'rgba(255,192,124,.55)');sg.addColorStop(.3,'rgba(255,140,90,.18)');sg.addColorStop(1,'rgba(255,120,80,0)');
  x.fillStyle=sg;x.fillRect(0,0,W,LY);
  const fog=[236,176,128],cols=[[84,98,140],[62,78,104],[40,58,70],[24,40,40]];
  for(let L=0;L<4;L++){
    const base=H*(.37+.05*L),amp=H*(.17-.028*L),fr=1.6+L*.9,haze=.78-.2*L;
    const c=cols[L].map((v,i)=>Math.round(v*(1-haze)+fog[i]*haze));
    const b=c.map((v,i)=>Math.round(v*.45+fog[i]*.55*(L<3?1:.3)));
    const gg=x.createLinearGradient(0,base-amp,0,LY);
    gg.addColorStop(0,'rgb('+c.join(',')+')');gg.addColorStop(1,'rgb('+b.join(',')+')');
    const pts=[];
    x.beginPath();x.moveTo(0,LY);
    for(let i=0;i<=W;i+=4){const ny=base-amp*(Math.pow(fbm(i/W*fr*3,L*3.7,5,0,40+L),1.35)*1.6-.25);pts.push([i,ny]);x.lineTo(i,ny);}
    x.lineTo(W,LY);x.closePath();x.fillStyle=gg;x.fill();
    x.beginPath();pts.forEach((p,i)=>{if(i)x.lineTo(p[0],p[1]);else x.moveTo(p[0],p[1]);});
    const rg=x.createLinearGradient(0,0,W,0);
    rg.addColorStop(0,'rgba(255,200,140,0)');
    rg.addColorStop(Math.min(.95,SUN.x/W),'rgba(255,215,160,'+(.35-.06*L)+')');
    rg.addColorStop(1,'rgba(255,200,140,0)');
    x.strokeStyle=rg;x.lineWidth=2;x.stroke();
  }
  const lg=x.createLinearGradient(0,LY,0,H);lg.addColorStop(0,'#13283a');lg.addColorStop(1,'#06101a');
  x.fillStyle=lg;x.fillRect(0,LY,W,H-LY);
}

function buildFG(){
  const x=fg.getContext('2d'),r=mulberry32(21);
  x.beginPath();x.moveTo(0,H);
  for(let i=0;i<=W;i+=6){x.lineTo(i,MY-18+(fbm(i/W*5,2.2,4,0,90)-.5)*70+Math.sin(i/W*3.1)*10);}
  x.lineTo(W,H);x.closePath();
  const g=x.createLinearGradient(0,MY-50,0,H);
  g.addColorStop(0,'#566a35');g.addColorStop(.25,'#33471f');g.addColorStop(1,'#0b150a');
  x.fillStyle=g;x.fill();
  x.globalCompositeOperation='source-atop';
  for(let i=0;i<3200;i++){
    const px=r()*W,py=MY+30+Math.pow(r(),.9)*(H-MY-30),d=(py-MY)/(H-MY);
    x.fillStyle=r()<.5?'rgba(10,18,8,.10)':'rgba(120,140,60,.07)';
    x.beginPath();x.ellipse(px,py,6+r()*30*(.5+d),1.5+r()*6*(.5+d),0,0,6.283);x.fill();
  }
  x.save();x.translate(SUN.x,MY+60);x.scale(1,.22);
  const sh=x.createRadialGradient(0,0,0,0,0,820);
  sh.addColorStop(0,'rgba(255,190,110,.42)');sh.addColorStop(1,'rgba(255,150,80,0)');
  x.fillStyle=sh;x.fillRect(-900,-900,1800,1800);x.restore();
  x.globalCompositeOperation='source-over';
}

function makeTree(h,seed){
  const w=Math.round(h*.46),c=mkCanvas(w,Math.round(h)),x=c.getContext('2d'),r=mulberry32(seed);
  x.fillStyle='#1a120c';x.fillRect(w/2-h*.012,h*.82,h*.024,h*.18);
  const tiers=9;
  for(let i=0;i<tiers;i++){
    const t=i/tiers,y0=h*(.04+t*.8),th=h*(.2+t*.06),tw=w*(.28+t*.72)*(.92+r()*.16);
    const g=x.createLinearGradient(w/2-tw/2,0,w/2+tw/2,0);
    g.addColorStop(0,'#0a130d');g.addColorStop(.55,'#1a3020');g.addColorStop(1,'#46603a');
    x.fillStyle=g;x.beginPath();x.moveTo(w/2,y0);
    for(let k=1;k<=5;k++){const f=k/5;x.lineTo(w/2-tw/2*f-(k%2?tw*.04:0),y0+th*f);}
    for(let k=5;k>=1;k--){const f=k/5;x.lineTo(w/2+tw/2*f+(k%2?tw*.04:0),y0+th*f);}
    x.closePath();x.fill();
  }
  return c;
}

function buildAssets(){
  buildBG();buildFG();
  cloudA=fbmTex(760,160,3,1.6,5,11,[255,205,170],1.3,.95);
  cloudB=fbmTex(760,120,4,1.4,5,29,[255,225,200],1.5,.7);
  mist=fbmTex(760,100,4,1.2,4,57,[228,204,196],1.1,.85);
  bokeh=mkCanvas(128,128);
  {const x=bokeh.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,62);
   g.addColorStop(0,'rgba(255,220,160,.55)');g.addColorStop(.8,'rgba(255,200,130,.35)');g.addColorStop(.92,'rgba(255,230,190,.6)');g.addColorStop(1,'rgba(255,220,160,0)');
   x.fillStyle=g;x.fillRect(0,0,128,128);}
  vig=mkCanvas(W,H);
  {const x=vig.getContext('2d'),g=x.createRadialGradient(W/2,H*.52,H*.35,W/2,H*.52,W*.62);
   g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(2,4,10,.62)');x.fillStyle=g;x.fillRect(0,0,W,H);}
  grain=mkCanvas(256,256);
  {const x=grain.getContext('2d'),im=x.createImageData(256,256),r=mulberry32(5);
   for(let i=0;i<65536;i++){const v=Math.floor(r()*255);im.data[i*4]=v;im.data[i*4+1]=v;im.data[i*4+2]=v;im.data[i*4+3]=34;}
   x.putImageData(im,0,0);grainPat=ctx.createPattern(grain,'repeat');}
  treeSprites=[makeTree(200,101),makeTree(200,202),makeTree(200,303)];
  bigSprite=makeTree(1000,404);
  const r=mulberry32(77);
  farTrees=[];
  for(let i=0;i<110;i++)farTrees.push({x:r()*W,h:34+r()*52,k:Math.floor(r()*3),ph:r()*6.28});
  bigTrees=[{x:-40,h:1180,ph:0},{x:190,h:930,ph:1.7},{x:W-330,h:980,ph:3.1},{x:W-60,h:1200,ph:4.4}];
  GX=new Float32Array(GR_N[2]);GY=new Float32Array(GR_N[2]);GH=new Float32Array(GR_N[2]);GP=new Float32Array(GR_N[2]);
  for(let i=0;i<GR_N[2];i++){
    const y=MY+20+Math.pow(r(),.8)*(H-MY-30),d=(y-MY)/(H-MY);
    GX[i]=r()*W;GY[i]=y;GH[i]=14+d*d*120*(.6+r()*.8);GP[i]=r()*6.28;
  }
  pollen=[];for(let i=0;i<170;i++)pollen.push({x:r()*W,y:r()*H,vx:4+r()*10,vy:-2-r()*6,s:1.2+r()*2.4,ph:r()*6.28});
  boks=[];for(let i=0;i<14;i++)boks.push({x:r()*W,y:r()*H,s:30+r()*80,a:.05+r()*.08,vx:3+r()*8,ph:r()*6.28});
  glit=[];for(let i=0;i<80;i++)glit.push({gx:(r()-.5),gy:r(),w:6+r()*28,p:r()*10});
  resetDeer();
}

function resetDeer(){
  const r=mulberry32(12345);
  deer=[];
  const ys=[.80,.86,.92,.83,.89];
  for(let i=0;i<5;i++)deer.push({x:r()*(W+300)-150,y:H*ys[i],sp:12+r()*14,ph:r()*6.28,stag:i%2===0,id:'TRK-0'+(i+1)});
}

/* ---------- DEER ---------- */
function drawDeer(d,t){
  const s=.8+((d.y-MY)/(H-MY))*1.35,ph=d.ph+t*(d.sp*.16),bob=Math.sin(ph*2)*1.2;
  ctx.save();ctx.translate(d.x,d.y);ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(8,2,48,6,0,0,6.283);ctx.fill();
  const bgr=ctx.createLinearGradient(0,-56,0,-24);bgr.addColorStop(0,'#3d2c20');bgr.addColorStop(1,'#120d09');
  ctx.fillStyle=bgr;ctx.strokeStyle='#150f0b';ctx.lineCap='round';ctx.lineJoin='round';
  const legs=[[-22,0,4.6],[-15,Math.PI,4.2],[20,Math.PI,3.8],[27,0,3.6]];
  for(const lg of legs){
    const a=Math.sin(ph+lg[1])*.5,hx=lg[0],kx=hx+Math.sin(a)*13,ky=-34+Math.cos(a)*13;
    const lift=Math.max(0,Math.cos(ph+lg[1]+1.5))*5;
    ctx.lineWidth=lg[2];ctx.beginPath();ctx.moveTo(hx,-34+bob);ctx.lineTo(kx,ky);ctx.lineTo(kx+Math.sin(a)*4,-1-lift);ctx.stroke();
  }
  ctx.beginPath();ctx.ellipse(2,-40+bob,31,13,0,0,6.283);ctx.fill();
  ctx.beginPath();ctx.moveTo(24,-48+bob);ctx.lineTo(42,-78+bob);ctx.lineTo(50,-74+bob);ctx.lineTo(34,-38+bob);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(50,-79+bob,9,5.2,.5,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(58,-76+bob,5,3.4,.6,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(44,-87+bob,2.4,6,-.4,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(-31,-46+bob,3,5.5,.5,0,6.283);ctx.fill();
  if(d.stag){
    ctx.lineWidth=1.7;ctx.beginPath();
    ctx.moveTo(47,-86+bob);ctx.lineTo(44,-104+bob);ctx.lineTo(38,-120+bob);
    ctx.moveTo(44,-104+bob);ctx.lineTo(50,-114+bob);
    ctx.moveTo(41,-112+bob);ctx.lineTo(34,-110+bob);
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,196,130,.55)';ctx.lineWidth=1.3;
  ctx.beginPath();ctx.ellipse(2,-40+bob,31,13,0,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
  ctx.beginPath();ctx.moveTo(24,-48+bob);ctx.lineTo(42,-78+bob);ctx.stroke();
  ctx.restore();
}

/* ---------- STATE ---------- */
let running=false,raf=0,last=0,t=0,ema=16,fps=60,level=2,auto=true,lastChg=0,frameN=0,chainLen=0,head='',lastStamp=0,heading=38;
const bl=mkCanvas(475,267),bx=bl.getContext('2d'),hasF='filter' in bx;
let selfTest={pass:0,total:0,res:[]};

function runSelfTest(){
  const res=[];
  res.push(['sha256("abc")',sha256('abc')==='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad']);
  res.push(['sha256("")',sha256('')==='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855']);
  res.push(['noise deterministic',vnoise(1.5,2.5,0,3)===vnoise(1.5,2.5,0,3)]);
  res.push(['noise tiles on x',Math.abs(fbm(0,.4,4,3,9)-fbm(3,.4,4,3,9))<1e-9]);
  res.push(['rng seeded',mulberry32(9)()===mulberry32(9)()]);
  selfTest={res:res,pass:res.filter(r=>r[1]).length,total:res.length};
  return selfTest;
}

function genesis(){head=sha256(MODULE_META.id+':genesis:'+Date.now());chainLen=1;lastStamp=t;}
function chainTick(){
  if(t-lastStamp>=1){lastStamp=t;head=sha256(head+'|'+Math.floor(t)+'|'+Math.round(fps)+'|'+level);chainLen++;}
}

function governor(now){
  if(!auto)return;
  if(now-lastChg<3000)return;
  if(ema>30&&level>0){level--;lastChg=now;}
  else if(ema<15&&level<2&&now-lastChg>7000){level++;lastChg=now;}
}

function update(dt){
  for(const d of deer){d.x+=d.sp*dt;if(d.x>W+160)d.x=-160;}
  for(const p of pollen){p.x+=(p.vx+Math.sin(t*.7+p.ph)*4)*dt;p.y+=(p.vy+Math.cos(t*.5+p.ph)*3)*dt;if(p.x>W+10)p.x=-10;if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;}
  for(const b of boks){b.x+=b.vx*dt;if(b.x>W+100)b.x=-100;}
  heading=38+Math.sin(t*.05)*14;
}

/* ---------- DRAW ---------- */
function draw(){
  const c=ctx;
  c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;
  c.drawImage(bg,0,0);
  const pulse=.85+.15*Math.sin(t*.7);
  let g=c.createRadialGradient(SUN.x,SUN.y,0,SUN.x,SUN.y,380*pulse);
  g.addColorStop(0,'rgba(255,235,190,.55)');g.addColorStop(1,'rgba(255,170,100,0)');
  c.globalCompositeOperation='lighter';c.fillStyle=g;c.fillRect(SUN.x-400,SUN.y-400,800,800);
  c.globalCompositeOperation='screen';
  let ox=(t*5)%W;c.globalAlpha=.55;c.drawImage(cloudA,ox-W,0,W,H*.30);c.drawImage(cloudA,ox,0,W,H*.30);
  ox=(t*9)%W;c.globalAlpha=.35;c.drawImage(cloudB,ox-W,H*.12,W,H*.2);c.drawImage(cloudB,ox,H*.12,W,H*.2);
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  /* far shore trees */
  c.globalAlpha=.88;
  for(const f of farTrees){
    const sw=Math.sin(t*1.1+f.ph)*.012;
    c.setTransform(1,0,sw,1,-sw*LY,0);
    c.drawImage(treeSprites[f.k],f.x-f.h*.23,LY-f.h,f.h*.46,f.h);
  }
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  /* lake reflection */
  const step=level===2?4:level===1?6:9,lakeH=MY-LY+40;
  for(let y=0;y<lakeH;y+=step){
    const sy=LY-(y+step)*1.7;if(sy<0)break;
    const off=Math.sin(t*1.4+y*.09)*(1.5+y*.045)+Math.sin(t*.6+y*.2)*1.2;
    c.drawImage(bg,0,sy,W,step*1.7,off,LY+y,W,step);
  }
  g=c.createLinearGradient(0,LY,0,LY+lakeH);g.addColorStop(0,'rgba(18,42,62,.28)');g.addColorStop(1,'rgba(8,20,30,.58)');
  c.fillStyle=g;c.fillRect(0,LY,W,lakeH);
  if(level>=1){
    c.globalCompositeOperation='lighter';
    g=c.createLinearGradient(0,LY,0,LY+lakeH);g.addColorStop(0,'rgba(255,210,150,.30)');g.addColorStop(1,'rgba(255,190,120,.05)');
    c.fillStyle=g;c.fillRect(SUN.x-38,LY,76,lakeH);
    const n=level===2?glit.length:40;
    for(let i=0;i<n;i++){
      const q=glit[i],a=Math.max(0,Math.sin(t*3+q.p))*.8*(1-q.gy*.6);
      if(a<.05)continue;
      c.fillStyle='rgba(255,230,180,'+a.toFixed(2)+')';
      c.fillRect(SUN.x+q.gx*260*(.4+q.gy)-q.w/2,LY+q.gy*lakeH,q.w,2);
    }
    c.globalCompositeOperation='source-over';
  }
  /* mist */
  ox=(t*10)%W;c.globalAlpha=.5;c.drawImage(mist,ox-W,LY-70,W,150);c.drawImage(mist,ox,LY-70,W,150);
  ox=W-((t*6)%W);c.globalAlpha=.3;c.drawImage(mist,ox-W,LY-10,W,120);c.drawImage(mist,ox,LY-10,W,120);
  c.globalAlpha=1;
  c.drawImage(fg,0,0);
  /* deer */
  const ds=deer.slice().sort((a,b)=>a.y-b.y);
  for(const d of ds)drawDeer(d,t);
  /* grass */
  const n=GR_N[level],wind=Math.sin(t*.35)*.4;
  const GCOL=['#13200f','#2c4219','rgba(150,160,70,.9)'],GW=[2.6,2.1,1.6];
  c.lineCap='round';
  for(let b=0;b<3;b++){
    c.beginPath();
    for(let i=b;i<n;i+=3){
      const x=GX[i],y=GY[i],h=GH[i];
      const sw=(Math.sin(t*1.4+GP[i]+x*.003)+.6*Math.sin(t*.5+x*.001)+wind)*h*.12;
      c.moveTo(x,y);c.quadraticCurveTo(x+sw*.5,y-h*.6,x+sw,y-h);
    }
    c.strokeStyle=GCOL[b];c.lineWidth=GW[b];c.stroke();
  }
  /* big foreground trees */
  c.globalAlpha=.96;
  for(const f of bigTrees){
    const sw=Math.sin(t*.6+f.ph)*.006,base=H+50;
    c.setTransform(1,0,sw,1,-sw*base,0);
    c.drawImage(bigSprite,f.x-f.h*.23,base-f.h,f.h*.46,f.h);
  }
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  /* god rays */
  c.globalCompositeOperation='lighter';
  for(let i=0;i<8;i++){
    const a=1.7+i*.115,d=.045,len=1500;
    const al=.05+.035*Math.sin(t*.5+i*1.7);
    const gr=c.createLinearGradient(SUN.x,SUN.y,SUN.x+Math.cos(a)*len,SUN.y+Math.sin(a)*len);
    gr.addColorStop(0,'rgba(255,205,140,'+al.toFixed(3)+')');gr.addColorStop(1,'rgba(255,205,140,0)');
    c.fillStyle=gr;c.beginPath();c.moveTo(SUN.x,SUN.y);
    c.lineTo(SUN.x+Math.cos(a-d)*len,SUN.y+Math.sin(a-d)*len);
    c.lineTo(SUN.x+Math.cos(a+d)*len,SUN.y+Math.sin(a+d)*len);
    c.closePath();c.fill();
  }
  /* pollen + bokeh */
  const pn=level===2?pollen.length:level===1?90:40;
  for(let i=0;i<pn;i++){
    const p=pollen[i],a=(.35+.35*Math.sin(t*2+p.ph));
    c.fillStyle='rgba(255,226,170,'+a.toFixed(2)+')';c.fillRect(p.x,p.y,p.s,p.s);
  }
  if(level>=1){
    for(const b of boks){c.globalAlpha=b.a*(.7+.3*Math.sin(t*.8+b.ph));c.drawImage(bokeh,b.x-b.s/2,b.y-b.s/2,b.s,b.s);}
    c.globalAlpha=1;
  }
  c.globalCompositeOperation='source-over';
  /* bloom */
  if(level>=1&&(level===2||frameN%3===0)){
    bx.globalCompositeOperation='source-over';
    if(hasF)bx.filter='brightness(.75) contrast(1.8) blur(5px)';
    bx.drawImage(cv,0,0,475,267);
    if(hasF)bx.filter='none';
  }
  if(level>=1){c.globalCompositeOperation='screen';c.globalAlpha=hasF?.55:.16;c.drawImage(bl,0,0,W,H);c.globalAlpha=1;c.globalCompositeOperation='source-over';}
  /* grade */
  g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,170,90,.30)');g.addColorStop(1,'rgba(40,90,130,.30)');
  c.globalCompositeOperation='soft-light';c.fillStyle=g;c.fillRect(0,0,W,H);
  c.globalCompositeOperation='source-over';
  c.drawImage(vig,0,0);
  if(level>=1&&grainPat){
    const gx=Math.floor(Math.random()*256),gy=Math.floor(Math.random()*256);
    c.save();c.globalCompositeOperation='overlay';c.translate(gx,gy);c.fillStyle=grainPat;c.fillRect(-gx,-gy,W,H);c.restore();
  }
  drawHUD();
}

/* ---------- HUD ---------- */
function brackets(x,y,w,h,l,col,lw){
  const c=ctx;c.strokeStyle=col;c.lineWidth=lw;c.beginPath();
  c.moveTo(x,y+l);c.lineTo(x,y);c.lineTo(x+l,y);
  c.moveTo(x+w-l,y);c.lineTo(x+w,y);c.lineTo(x+w,y+l);
  c.moveTo(x+w,y+h-l);c.lineTo(x+w,y+h);c.lineTo(x+w-l,y+h);
  c.moveTo(x+l,y+h);c.lineTo(x,y+h);c.lineTo(x,y+h-l);
  c.stroke();
}
function glass(x,y,w,h){
  ctx.fillStyle='rgba(6,12,26,.58)';ctx.fillRect(x,y,w,h);
  brackets(x,y,w,h,16,'rgba(212,175,55,.85)',2);
}
function drawHUD(){
  const c=ctx;c.textAlign='left';
  brackets(36,36,W-72,H-72,90,'rgba(212,175,55,.8)',3);
  /* compass */
  const cx=W/2,cy=52,pw=6;
  c.save();c.beginPath();c.rect(cx-380,cy-26,760,62);c.clip();
  c.fillStyle='rgba(6,12,26,.5)';c.fillRect(cx-380,cy-26,760,62);
  c.strokeStyle='rgba(212,175,55,.9)';c.fillStyle='#e8d9a0';c.font='15px '+FONT;c.textAlign='center';c.lineWidth=1.5;
  for(let d=Math.floor(heading-66);d<=heading+66;d++){
    if(d%5)continue;
    const px=cx+(d-heading)*pw,m=((d%360)+360)%360,big=m%10===0;
    c.beginPath();c.moveTo(px,cy+(big?6:12));c.lineTo(px,cy+22);c.stroke();
    if(big){const lab=m===0?'N':m===90?'E':m===180?'S':m===270?'W':String(m);c.fillText(lab,px,cy+2);}
  }
  c.restore();
  c.fillStyle='#3de0ff';c.beginPath();c.moveTo(cx,cy+30);c.lineTo(cx-7,cy+42);c.lineTo(cx+7,cy+42);c.closePath();c.fill();
  c.textAlign='center';c.font='bold 16px '+FONT;c.fillText(Math.round(heading)+'°',cx,cy+64);
  /* left panel */
  c.textAlign='left';glass(60,110,560,150);
  c.fillStyle='#d4af37';c.font='bold 20px '+FONT;c.fillText('REALITYSTATEOS · HUNT SURVEY',80,142);
  c.fillStyle='#9fe8ff';c.font='14px '+MONO;
  c.fillText(MODULE_META.id+' · 1900×1069 · SIMULATED SCENE',80,168);
  c.fillStyle=selfTest.pass===selfTest.total?'#7dffb0':'#ff7d7d';
  c.fillText('SELF_TEST '+selfTest.pass+'/'+selfTest.total,80,192);
  c.fillStyle='#9fe8ff';
  c.fillText('BUS '+head.slice(0,24)+'… #'+chainLen,80,216);
  c.fillText('FPS '+fps.toFixed(0)+' · QUALITY '+['LITE','MED','HIGH'][level]+(auto?' (AUTO)':''),80,240);
  /* right panel */
  const rw=380,rx=W-60-rw,rh=56+deer.length*26;
  glass(rx,110,rw,rh);
  c.fillStyle='#d4af37';c.font='bold 16px '+FONT;c.fillText('CONTACTS',rx+20,140);
  c.font='14px '+MONO;
  deer.forEach((d,i)=>{
    const rng=Math.round(40+(1-(d.y-MY)/(H-MY))*160),brg=Math.round((heading+(d.x-W/2)/W*60+360)%360);
    c.fillStyle='#9fe8ff';c.fillText(d.id+'  '+String(rng).padStart(3,' ')+' m  brg '+String(brg).padStart(3,'0')+'°',rx+20,168+i*26);
  });
  /* reticles */
  for(const d of deer){
    const s=.8+((d.y-MY)/(H-MY))*1.35,bw=100*s+16,bh=98*s+14,bx0=d.x-35*s-8,by0=d.y-92*s-6;
    const al=.65+.3*Math.sin(t*3+d.ph);
    brackets(bx0,by0,bw,bh,Math.max(10,14*s),'rgba(61,224,255,'+al.toFixed(2)+')',2);
    c.fillStyle='rgba(61,224,255,.95)';c.font='13px '+MONO;c.textAlign='left';
    c.fillText(d.id,bx0,by0-8);
  }
  /* scan line */
  const sy=((t/6)%1)*(H-72)+36;
  const sg=c.createLinearGradient(0,sy-30,0,sy);sg.addColorStop(0,'rgba(61,224,255,0)');sg.addColorStop(1,'rgba(61,224,255,.12)');
  c.fillStyle=sg;c.fillRect(36,sy-30,W-72,30);
  c.fillStyle='rgba(61,224,255,.35)';c.fillRect(36,sy,W-72,1.5);
  /* footer */
  c.textAlign='center';c.fillStyle='rgba(212,175,55,.85)';c.font='13px '+FONT;
  c.fillText('REALITYSTATEOS™ · '+MODULE_META.bus+' · PROCEDURAL RENDER · NO EXTERNAL ASSETS',W/2,H-52);
  c.textAlign='left';
}

/* ---------- LOOP + LIFECYCLE ---------- */
function frame(now){
  if(!running){raf=0;return;}
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;frameN++;
  ema+=(dt*1000-ema)*.08;fps=1000/ema;
  governor(now);update(dt);draw();chainTick();
}
const API={
  meta:MODULE_META,
  init(){buildAssets();runSelfTest();genesis();draw();return selfTest;},
  start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);},
  pause(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;},
  resume(){API.start();},
  reset(){t=0;resetDeer();genesis();ema=16;},
  destroy(){API.pause();document.removeEventListener('visibilitychange',onVis);},
  self_test(){return runSelfTest();}
};
function onVis(){if(document.hidden){if(running){API.pause();onVis.was=true;}}else if(onVis.was){onVis.was=false;API.resume();}}
document.addEventListener('visibilitychange',onVis);

const bp=document.getElementById('bp'),bq=document.getElementById('bq'),br=document.getElementById('br');
bp.onclick=function(){if(running){API.pause();bp.textContent='RESUME';}else{API.resume();bp.textContent='PAUSE';}};
bq.onclick=function(){
  if(auto){auto=false;level=2;}else if(level===2){level=1;}else if(level===1){level=0;}else{auto=true;}
  bq.textContent='QUALITY: '+(auto?'AUTO':['LITE','MED','HIGH'][level]);
  if(!running)draw();
};
br.onclick=function(){API.reset();if(!running)draw();};

window.RT_HUNT_001=API;
API.init();API.start();
})();
</script>
